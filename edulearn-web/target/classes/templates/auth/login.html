<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Login - EduLearn LMS</title>
</head>
<body>
<section class="d-flex align-items-center" style="min-height: 70vh;">
    <div class="row justify-content-center w-100">
        <div class="col-lg-5 col-md-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="row g-0">
                    <div class="col-12 p-5">
                        <div class="text-center mb-5">
                            <h2 class="fw-bold text-dark">Welcome Back</h2>
                            <p class="text-muted">Login to your account to continue</p>
                        </div>
                        
                        <div th:if="${param.error}" class="alert alert-danger border-0 rounded-3 mb-4">
                            <i class="fas fa-exclamation-circle me-2"></i>Invalid email or password
                        </div>
                        
                        <div th:if="${param.registered}" class="alert alert-success border-0 rounded-3 mb-4">
                            <i class="fas fa-check-circle me-2"></i>Account created! Please login.
                        </div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="email" name="email" class="form-control bg-light border-0 rounded-3" id="floatingInput" placeholder="name@example.com" required>
                                <label for="floatingInput" class="text-muted">Email address</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" name="password" class="form-control bg-light border-0 rounded-3" id="floatingPassword" placeholder="Password" required>
                                <label for="floatingPassword" class="text-muted">Password</label>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                    <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none small fw-bold">Forgot Password?</a>
                            </div>
                            
                            <button class="btn btn-primary btn-lg w-100 rounded-pill py-3 shadow-sm mb-4" type="submit">
                                Login <i class="fas fa-sign-in-alt ms-2"></i>
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <p class="text-muted small">Don't have an account? <a th:href="@{/auth/register}" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
