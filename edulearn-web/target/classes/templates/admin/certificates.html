<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>All Certificates - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Certificates Registry</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Verification Code</th>
                        <th>Student</th>
                        <th>Course</th>
                        <th>Issued Date</th>
                        <th class="pe-4 text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${certs}">
                        <td class="ps-4 font-monospace fw-bold text-primary small">[[${c.verificationCode}]]</td>
                        <td class="small">Student #[[${c.studentId}]]</td>
                        <td class="small fw-bold">[[${c.courseName}]]</td>
                        <td class="small text-muted" th:text="${c.issuedAt}">2025-10-12</td>
                        <td class="pe-4 text-end">
                            <a th:href="@{/certificates/verify/{code}(code=${c.verificationCode})}" target="_blank" class="btn btn-sm btn-link text-decoration-none">Verify <i class="fas fa-external-link-alt ms-1 small"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${certs == null || certs.length == 0}">
                        <td colspan="5" class="text-center py-5 text-muted small italic">No certificates issued yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
