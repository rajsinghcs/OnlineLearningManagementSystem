<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Bulk Notifications - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold mb-0">Bulk Notifications</h2>
                <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
            </div>

            <div th:if="${param.sent}" class="alert alert-success border-0 rounded-4 p-3 mb-4 shadow-sm">
                <i class="fas fa-check-circle me-2"></i>Notifications sent successfully to all users!
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-5">
                <form th:action="@{/admin/notifications/send}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Announcement Title</label>
                        <input type="text" name="title" class="form-control rounded-3 py-2" placeholder="e.g. Platform Update" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Target Audience</label>
                        <select class="form-select rounded-3 py-2" name="target">
                            <option value="ALL">All Users</option>
                            <option value="STUDENTS">Students Only</option>
                            <option value="INSTRUCTORS">Instructors Only</option>
                        </select>
                        <span class="x-small text-muted mt-2 d-block ms-1">Note: This will trigger in-app notifications.</span>
                    </div>

                    <!-- Hidden input for simple simulation of list of IDs -->
                    <input type="hidden" name="userIds" value="1,2,3">

                    <div class="mb-5">
                        <label class="form-label fw-bold small">Message Content</label>
                        <textarea name="message" class="form-control rounded-3" rows="6" placeholder="Type your announcement here..." required></textarea>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-warning btn-lg rounded-pill px-5 shadow fw-bold">
                            <i class="fas fa-paper-plane me-2"></i>Send Broadcast
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
