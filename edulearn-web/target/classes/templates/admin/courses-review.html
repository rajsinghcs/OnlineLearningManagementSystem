<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Review Courses - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Review Courses</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3">Course Info</th>
                        <th class="py-3">Instructor</th>
                        <th class="py-3">Price</th>
                        <th class="py-3">Status</th>
                        <th class="py-3 pe-4 text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${courses}">
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center">
                                <img th:src="${c.thumbnailUrl != null ? c.thumbnailUrl : '/images/default-course-thumbnail.jpg'}" class="rounded-3 me-3" width="70" height="45" style="object-fit: cover;">
                                <div>
                                    <div class="fw-bold small">[[${c.title}]]</div>
                                    <div class="x-small text-muted text-uppercase">[[${c.category}]]</div>
                                </div>
                            </div>
                        </td>
                        <td class="small">[[${c.instructorName}]]</td>
                        <td class="small fw-bold">₹[[${c.price}]]</td>
                        <td>
                            <span class="badge rounded-pill px-3" th:classappend="${c.isApproved ? 'bg-success' : 'bg-warning'}" th:text="${c.isApproved ? 'Approved' : 'Pending'}">Pending</span>
                        </td>
                        <td class="pe-4 text-end">
                            <div th:unless="${c.isApproved}" class="d-flex justify-content-end gap-2">
                                <form th:action="@{/admin/courses/{id}/approve(id=${c.courseId})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 shadow-sm">Approve</button>
                                </form>
                                <form th:action="@{/admin/courses/{id}/reject(id=${c.courseId})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">Reject</button>
                                </form>
                            </div>
                            <span th:if="${c.isApproved}" class="text-success small fw-bold"><i class="fas fa-check-circle me-1"></i>Approved</span>
                        </td>
                    </tr>
                    <tr th:if="${courses == null || courses.length == 0}">
                        <td colspan="5" class="text-center py-5 text-muted small italic">No courses submitted for review.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
