<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Platform Analytics - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Platform Analytics</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <!-- Overview Charts Placeholder -->
    <div class="row g-4 mb-5">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                <h6 class="fw-bold mb-4">Revenue Growth</h6>
                <div class="bg-light rounded-4 d-flex align-items-center justify-content-center" style="height: 300px;">
                    <span class="text-muted italic"><i class="fas fa-chart-line me-2"></i>Revenue Chart Visualization</span>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                <h6 class="fw-bold mb-4">User Distribution</h6>
                <div class="bg-light rounded-4 d-flex align-items-center justify-content-center" style="height: 300px;">
                    <span class="text-muted italic"><i class="fas fa-chart-pie me-2"></i>User Base Pie Chart</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <h6 class="fw-bold mb-4">Top Performing Courses</h6>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light small">
                    <tr>
                        <th class="ps-4">Course</th>
                        <th>Instructor</th>
                        <th class="text-center">Enrollments</th>
                        <th class="text-center">Revenue</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${courses}" class="small">
                        <td class="ps-4 fw-bold">[[${c.title}]]</td>
                        <td th:text="${c.instructorName}">Instructor</td>
                        <td class="text-center">0</td>
                        <td class="text-center">₹0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
