<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Manage Lessons - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold mb-1">Manage Lessons</h2>
            <p class="text-muted small mb-0">Course: <span class="text-primary fw-bold">[[${course.title}]]</span></p>
        </div>
        <a th:href="@{/instructor/dashboard}" class="btn btn-light rounded-pill px-4">Back to Dashboard</a>
    </div>

    <!-- Existing Lessons -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold">Current Lessons</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Order</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Duration</th>
                            <th class="pe-4 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${lessons}">
                            <td class="ps-4 fw-bold">[[${l.orderIndex}]]</td>
                            <td>
                                <div class="fw-medium">[[${l.title}]]</div>
                                <span th:if="${l.isPreview}" class="badge bg-success-subtle text-success x-small rounded-pill">Preview</span>
                            </td>
                            <td th:text="${l.contentType}">VIDEO</td>
                            <td th:text="${l.durationMinutes + ' min'}">10 min</td>
                            <td class="pe-4 text-end">
                                <form th:action="@{/instructor/lessons/{id}/delete(id=${l.lessonId})}" method="post" class="d-inline">
                                    <input type="hidden" name="courseId" th:value="${course.courseId}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="return confirm('Are you sure?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${lessons == null || lessons.length == 0}">
                            <td colspan="5" class="text-center py-4 text-muted italic small">No lessons added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add New Lesson -->
    <div class="card border-0 shadow-sm rounded-4 p-5">
        <h5 class="fw-bold mb-4">Add New Lesson</h5>
        <form th:action="@{/instructor/courses/{id}/lessons/add(id=${course.courseId})}" method="post" th:object="${newLesson}">
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label fw-bold small">Lesson Title</label>
                    <input type="text" th:field="*{title}" class="form-control rounded-3" placeholder="e.g. Introduction" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold small">Order Index</label>
                    <input type="number" th:field="*{orderIndex}" class="form-control rounded-3" required>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Content Type</label>
                    <select th:field="*{contentType}" class="form-select rounded-3" required>
                        <option value="VIDEO">Video</option>
                        <option value="TEXT">Text/Article</option>
                        <option value="EMBED">Embed/YouTube</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Duration (Minutes)</label>
                    <input type="number" th:field="*{durationMinutes}" class="form-control rounded-3" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small">Content URL</label>
                <input type="text" th:field="*{contentUrl}" class="form-control rounded-3" placeholder="https://example.com/video.mp4">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small">Description / Text Content</label>
                <textarea th:field="*{description}" class="form-control rounded-3" rows="4"></textarea>
            </div>

            <div class="mb-5">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{isPreview}" id="flexSwitchCheckDefault">
                    <label class="form-check-label small fw-bold" for="flexSwitchCheckDefault">Set as free preview lesson</label>
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">Add Lesson</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
