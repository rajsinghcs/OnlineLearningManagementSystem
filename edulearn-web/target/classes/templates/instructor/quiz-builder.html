<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quiz Builder - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold mb-0">Quiz Builder</h2>
                <a th:href="@{/instructor/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-5 mb-5">
                <h5 class="fw-bold mb-4">Quiz Settings</h5>
                <form th:action="@{/instructor/courses/{id}/quiz/new(id=${courseId})}" method="post" th:object="${quiz}">
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Quiz Title</label>
                        <input type="text" th:field="*{title}" class="form-control rounded-3" placeholder="e.g. Final Assessment" required>
                    </div>

                    <div class="row g-3 mb-5">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Time Limit (Mins)</label>
                            <input type="number" th:field="*{timeLimitMinutes}" class="form-control rounded-3" value="30" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Passing Score (%)</label>
                            <input type="number" th:field="*{passingScore}" class="form-control rounded-3" value="70" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Max Attempts</label>
                            <input type="number" th:field="*{maxAttempts}" class="form-control rounded-3" value="3" required>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">Save Quiz & Add Questions</button>
                    </div>
                </form>
            </div>

            <div class="alert alert-info border-0 rounded-4 p-4 shadow-sm">
                <div class="d-flex align-items-center">
                    <div class="bg-info text-white rounded-circle p-3 me-4">
                        <i class="fas fa-info-circle fa-lg"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Questions Management</h6>
                        <p class="mb-0 small text-muted">After saving quiz settings, you will be able to add multiple choice and true/false questions to this quiz.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
