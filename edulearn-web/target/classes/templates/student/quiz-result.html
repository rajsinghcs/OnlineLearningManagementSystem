<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quiz Result - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="row justify-content-center pt-5">
        <div class="col-lg-6 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <div class="mb-4">
                    <div th:if="${attempt.passed}" class="bg-success-subtle text-success rounded-circle d-inline-block p-4 mb-3">
                        <i class="fas fa-check-circle fa-4x"></i>
                    </div>
                    <div th:unless="${attempt.passed}" class="bg-danger-subtle text-danger rounded-circle d-inline-block p-4 mb-3">
                        <i class="fas fa-times-circle fa-4x"></i>
                    </div>
                    <h2 class="fw-bold" th:text="${attempt.passed ? 'Congratulations!' : 'Keep Trying!'}">Result</h2>
                    <p class="text-muted" th:text="${attempt.passed ? 'You have successfully passed the quiz.' : 'You didn\'t reach the passing score this time.'}">Message</p>
                </div>

                <div class="p-4 bg-light rounded-4 mb-4">
                    <div class="row g-0">
                        <div class="col-6 border-end">
                            <div class="x-small text-muted mb-1">Your Score</div>
                            <h1 class="fw-bold mb-0 text-primary">[[${attempt.score}]]%</h1>
                        </div>
                        <div class="col-6">
                            <div class="x-small text-muted mb-1">Status</div>
                            <h4 class="fw-bold mb-0" th:classappend="${attempt.passed ? 'text-success' : 'text-danger'}" th:text="${attempt.passed ? 'PASSED' : 'FAILED'}">PASSED</h4>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/student/dashboard}" class="btn btn-primary btn-lg rounded-pill py-3 shadow-sm">Back to Dashboard</a>
                    <a th:unless="${attempt.passed}" th:href="@{/student/quiz/{id}(id=${attempt.quizId})}" class="btn btn-outline-secondary btn-lg rounded-pill py-3">Retry Quiz</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
