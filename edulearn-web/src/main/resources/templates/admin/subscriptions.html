<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Manage Subscriptions - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Platform Subscriptions</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3">Student</th>
                        <th>Plan</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Status</th>
                        <th class="pe-4 text-end">Auto Renew</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${subs}">
                        <td class="ps-4 fw-bold small">Student #[[${s.studentId}]]</td>
                        <td><span class="badge bg-primary rounded-pill px-3">[[${s.plan}]]</span></td>
                        <td class="small" th:text="${s.startDate}">2025-01-01</td>
                        <td class="small" th:text="${s.endDate}">2026-01-01</td>
                        <td>
                            <span class="badge rounded-pill px-3" th:classappend="${s.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}" th:text="${s.status}">ACTIVE</span>
                        </td>
                        <td class="pe-4 text-end">
                            <i th:class="${s.autoRenew ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-muted'}"></i>
                        </td>
                    </tr>
                    <tr th:if="${subs == null || subs.length == 0}">
                        <td colspan="6" class="text-center py-5 text-muted small italic">No active subscriptions found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
