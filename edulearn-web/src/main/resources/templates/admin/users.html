<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Manage Users - EduLearn Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Manage Users</h2>
        <div class="dropdown">
            <button class="btn btn-light rounded-pill px-4 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Filter: [[${selectedRole != null ? selectedRole : 'All'}]]
            </button>
            <ul class="dropdown-menu border-0 shadow-sm">
                <li><a class="dropdown-item" th:href="@{/admin/users}">All Roles</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/users(role='STUDENT')}">Students</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/users(role='INSTRUCTOR')}">Instructors</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/users(role='ADMIN')}">Admins</a></li>
            </ul>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Name & Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th class="pe-4 text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <img th:src="${u.profilePicUrl != null ? u.profilePicUrl : '/images/default-avatar.png'}" 
                                     class="rounded-circle me-3" width="40" height="40" alt="User">
                                <div>
                                    <div class="fw-bold">[[${u.fullName}]]</div>
                                    <div class="x-small text-muted">[[${u.email}]]</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge rounded-pill px-3" 
                                  th:classappend="${u.role == 'ADMIN' ? 'bg-danger-subtle text-danger' : (u.role == 'INSTRUCTOR' ? 'bg-warning-subtle text-warning' : 'bg-primary-subtle text-primary')}"
                                  th:text="${u.role}">STUDENT</span>
                        </td>
                        <td>
                            <span class="badge rounded-pill px-3" th:classappend="${u.isActive ? 'bg-success' : 'bg-secondary'}" th:text="${u.isActive ? 'Active' : 'Suspended'}">Active</span>
                        </td>
                        <td class="pe-4 text-end">
                            <form th:action="@{/admin/users/{id}/suspend(id=${u.userId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-warning rounded-pill px-3 me-2" th:text="${u.isActive ? 'Suspend' : 'Activate'}">Suspend</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.userId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="return confirm('Delete user forever?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${users == null || users.length == 0}">
                        <td colspan="4" class="text-center py-5 text-muted small italic">No users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
