<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Checkout - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="row g-5">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-4">Checkout</h3>
            
            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 mb-4">
                <i class="fas fa-exclamation-circle me-2"></i>[[${error}]]
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                <h6 class="fw-bold mb-4">Payment Method</h6>
                <form th:action="@{/student/checkout/{id}(id=${course.courseId})}" method="post" id="paymentForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="radio" class="btn-check" name="paymentMode" id="payCard" value="CARD" checked>
                            <label class="btn btn-outline-light text-dark border w-100 p-4 rounded-4 text-center h-100" for="payCard">
                                <i class="far fa-credit-card fa-2x mb-2 text-primary"></i>
                                <div class="fw-bold small">Credit/Debit Card</div>
                            </label>
                        </div>
                        <div class="col-md-6">
                            <input type="radio" class="btn-check" name="paymentMode" id="payUPI" value="UPI">
                            <label class="btn btn-outline-light text-dark border w-100 p-4 rounded-4 text-center h-100" for="payUPI">
                                <i class="fas fa-mobile-alt fa-2x mb-2 text-success"></i>
                                <div class="fw-bold small">UPI / Net Banking</div>
                            </label>
                        </div>
                    </div>

                    <div id="cardDetails" class="mt-4 pt-3">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Card Number</label>
                            <input type="text" class="form-control rounded-3" placeholder="XXXX XXXX XXXX XXXX">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Expiry Date</label>
                                <input type="text" class="form-control rounded-3" placeholder="MM/YY">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">CVV</label>
                                <input type="password" class="form-control rounded-3" placeholder="***">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3">
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 shadow">
                            Complete Payment <i class="fas fa-lock ms-2 small"></i>
                        </button>
                        <p class="text-center text-muted x-small mt-3">
                            <i class="fas fa-shield-alt me-1"></i> Secure SSL Encrypted Payment
                        </p>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
                <h6 class="fw-bold mb-4">Order Summary</h6>
                <div class="d-flex gap-3 mb-4">
                    <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : '/images/default-course-thumbnail.jpg'}" 
                         class="rounded-3" width="100" height="60" style="object-fit: cover;" alt="Course">
                    <div>
                        <h6 class="fw-bold mb-1 text-truncate-2">[[${course.title}]]</h6>
                        <span class="x-small text-muted">Instructor: [[${course.instructorName}]]</span>
                    </div>
                </div>
                
                <hr class="my-4">
                
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted small">Course Price</span>
                    <span class="small">₹[[${course.price}]]</span>
                </div>
                <div class="d-flex justify-content-between mb-2 text-success">
                    <span class="small">Discount (70% OFF)</span>
                    <span class="small">-₹0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <span class="text-muted small">Tax (GST 18%)</span>
                    <span class="small">₹0.00</span>
                </div>
                
                <hr class="my-4">
                
                <div class="d-flex justify-content-between align-items-center mb-0">
                    <h5 class="fw-bold mb-0">Total</h5>
                    <h4 class="fw-bold text-primary mb-0">₹[[${course.price}]]</h4>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
