<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quiz History - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Quiz History</h2>
        <a href="javascript:history.back()" class="btn btn-light rounded-pill"><i class="fas fa-arrow-left me-2"></i>Back</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3">Quiz ID</th>
                        <th class="py-3">Date</th>
                        <th class="py-3 text-center">Score</th>
                        <th class="py-3 text-center">Status</th>
                        <th class="py-3 pe-4 text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="attempt : ${attempts}">
                        <td class="ps-4">#[[${attempt.quizId}]]</td>
                        <td th:text="${#temporals.format(attempt.submittedAt, 'dd MMM yyyy, HH:mm')}">12 Oct 2025</td>
                        <td class="text-center">
                            <span class="fw-bold" th:classappend="${attempt.passed ? 'text-success' : 'text-danger'}">[[${attempt.score}]]%</span>
                        </td>
                        <td class="text-center">
                            <span class="badge rounded-pill px-3" th:classappend="${attempt.passed ? 'bg-success' : 'bg-danger'}" th:text="${attempt.passed ? 'PASSED' : 'FAILED'}">PASSED</span>
                        </td>
                        <td class="pe-4 text-end">
                            <a th:href="@{/student/quiz/{id}/result(id=${attempt.attemptId})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">View Details</a>
                        </td>
                    </tr>
                    <tr th:if="${attempts == null || attempts.length == 0}">
                        <td colspan="5" class="text-center py-5 text-muted small italic">No quiz attempts found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
