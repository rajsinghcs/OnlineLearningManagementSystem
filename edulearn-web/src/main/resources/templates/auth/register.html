<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Join EduLearn - Register Now</title>
</head>
<body>
<section class="d-flex align-items-center" style="min-height: 80vh;">
    <div class="row justify-content-center w-100">
        <div class="col-lg-6 col-md-9">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="p-5">
                    <div class="text-center mb-5">
                        <h2 class="fw-bold text-dark">Create Account</h2>
                        <p class="text-muted">Join our community of lifelong learners</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger border-0 rounded-3 mb-4">
                        <i class="fas fa-exclamation-circle me-2"></i>[[${error}]]
                    </div>

                    <form th:action="@{/auth/register}" method="post" th:object="${user}">
                        <div class="row g-3">
                            <div class="col-12 mb-2">
                                <div class="form-floating">
                                    <input type="text" th:field="*{fullName}" class="form-control bg-light border-0 rounded-3" id="fullName" placeholder="John Doe" required>
                                    <label for="fullName" class="text-muted">Full Name</label>
                                </div>
                            </div>
                            <div class="col-12 mb-2">
                                <div class="form-floating">
                                    <input type="email" th:field="*{email}" class="form-control bg-light border-0 rounded-3" id="email" placeholder="name@example.com" required>
                                    <label for="email" class="text-muted">Email address</label>
                                </div>
                            </div>
                            <div class="col-12 mb-2">
                                <div class="form-floating">
                                    <input type="password" th:field="*{password}" class="form-control bg-light border-0 rounded-3" id="password" placeholder="Password" required>
                                    <label for="password" class="text-muted">Password</label>
                                </div>
                            </div>
                            <div class="col-12 mb-4">
                                <label class="form-label text-muted small ms-2">I want to join as a:</label>
                                <div class="d-flex gap-3">
                                    <input type="radio" class="btn-check" name="role" id="roleStudent" value="STUDENT" checked>
                                    <label class="btn btn-outline-primary flex-fill rounded-3 py-2" for="roleStudent">
                                        <i class="fas fa-user-graduate me-2"></i>Student
                                    </label>
                                    
                                    <input type="radio" class="btn-check" name="role" id="roleInstructor" value="INSTRUCTOR">
                                    <label class="btn btn-outline-primary flex-fill rounded-3 py-2" for="roleInstructor">
                                        <i class="fas fa-chalkboard-teacher me-2"></i>Instructor
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check small">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label text-muted" for="terms">
                                    I agree to the <a href="#" class="text-primary text-decoration-none fw-bold">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none fw-bold">Privacy Policy</a>
                                </label>
                            </div>
                        </div>

                        <button class="btn btn-primary btn-lg w-100 rounded-pill py-3 shadow-sm mb-4" type="submit">
                            Sign Up <i class="fas fa-user-plus ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="text-muted small">Already have an account? <a th:href="@{/auth/login}" class="text-primary fw-bold text-decoration-none">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
