<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Create Course - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="fw-bold mb-0">Create New Course</h2>
                <a th:href="@{/instructor/dashboard}" class="btn btn-light rounded-pill px-4">Cancel</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-5">
                <form th:action="@{/instructor/courses/new}" method="post" th:object="${course}">
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Course Title</label>
                        <input type="text" th:field="*{title}" class="form-control rounded-3 py-2" placeholder="e.g. Master Web Development" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Category</label>
                            <select th:field="*{category}" class="form-select rounded-3 py-2" required>
                                <option value="Programming">Programming</option>
                                <option value="Design">Design</option>
                                <option value="Business">Business</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Photography">Photography</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Level</label>
                            <select th:field="*{level}" class="form-select rounded-3 py-2" required>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Description</label>
                        <textarea th:field="*{description}" class="form-control rounded-3" rows="5" placeholder="What will students learn in this course?" required></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Price (INR)</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 bg-light rounded-start-3">₹</span>
                                <input type="number" th:field="*{price}" class="form-control bg-light border-0 rounded-end-3 py-2" step="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Language</label>
                            <input type="text" th:field="*{language}" class="form-control rounded-3 py-2" placeholder="e.g. English" required>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold small">Thumbnail URL</label>
                        <input type="text" th:field="*{thumbnailUrl}" class="form-control rounded-3 py-2" placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow">Create Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
