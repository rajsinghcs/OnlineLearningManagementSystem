<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Enrolled Students - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold mb-1">Enrolled Students</h2>
            <p class="text-muted small mb-0">Course ID: <span class="text-primary fw-bold">#[[${courseId}]]</span></p>
        </div>
        <a th:href="@{/instructor/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3">Student ID</th>
                        <th class="py-3">Enrolled At</th>
                        <th class="py-3 text-center">Progress</th>
                        <th class="py-3 text-center">Status</th>
                        <th class="py-3 pe-4 text-end">Certificate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${enrollments}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <img src="/images/default-avatar.png" class="rounded-circle me-3" width="35" height="35" alt="Student">
                                <span class="fw-bold">Student #[[${e.studentId}]]</span>
                            </div>
                        </td>
                        <td th:text="${#temporals.format(e.enrolledAt, 'dd MMM yyyy')}">12 Oct 2025</td>
                        <td class="text-center">
                            <div class="progress mx-auto" style="height: 6px; width: 100px;">
                                <div class="progress-bar" th:style="'width: ' + ${e.progressPercent} + '%'"></div>
                            </div>
                            <span class="x-small text-muted mt-1 d-block">[[${e.progressPercent}]]%</span>
                        </td>
                        <td class="text-center">
                            <span class="badge rounded-pill px-3" th:classappend="${e.status == 'ACTIVE' ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'}">[[${e.status}]]</span>
                        </td>
                        <td class="pe-4 text-end">
                            <span th:if="${e.certificateIssued}" class="text-success"><i class="fas fa-check-circle me-1"></i>Issued</span>
                            <span th:unless="${e.certificateIssued}" class="text-muted"><i class="far fa-clock me-1"></i>Pending</span>
                        </td>
                    </tr>
                    <tr th:if="${enrollments == null || enrollments.length == 0}">
                        <td colspan="5" class="text-center py-5 text-muted small italic">No students enrolled in this course yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
