<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Course Analytics - EduLearn LMS</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold mb-0">Course Analytics</h2>
        <a th:href="@{/instructor/dashboard}" class="btn btn-light rounded-pill px-4">Back</a>
    </div>

    <!-- Stats Row -->
    <div class="row g-4 mb-5 text-center">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-primary bg-primary-subtle rounded-circle d-inline-block p-3 mb-3">
                    <i class="fas fa-users fa-2x"></i>
                </div>
                <h2 class="fw-bold mb-1" th:text="${enrollmentCount}">0</h2>
                <span class="text-muted small">Total Enrollments</span>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-success bg-success-subtle rounded-circle d-inline-block p-3 mb-3">
                    <i class="fas fa-check-double fa-2x"></i>
                </div>
                <h2 class="fw-bold mb-1">0</h2>
                <span class="text-muted small">Completions</span>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-warning bg-warning-subtle rounded-circle d-inline-block p-3 mb-3">
                    <i class="fas fa-star fa-2x"></i>
                </div>
                <h2 class="fw-bold mb-1">4.9</h2>
                <span class="text-muted small">Average Rating</span>
            </div>
        </div>
    </div>

    <!-- Quizzes Table -->
    <div class="mb-5">
        <h5 class="fw-bold mb-4">Quiz Performance</h5>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Quiz Title</th>
                        <th class="text-center">Avg. Score</th>
                        <th class="text-center">Pass Rate</th>
                        <th class="pe-4 text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="q : ${quizzes}">
                        <td class="ps-4 fw-bold">[[${q.title}]]</td>
                        <td class="text-center">0%</td>
                        <td class="text-center">0%</td>
                        <td class="pe-4 text-end">
                            <button class="btn btn-sm btn-light rounded-pill px-3">Details</button>
                        </td>
                    </tr>
                    <tr th:if="${quizzes == null || quizzes.length == 0}">
                        <td colspan="4" class="text-center py-4 text-muted small italic">No quizzes for this course.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
