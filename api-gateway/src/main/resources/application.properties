# Server Configuration
server.port=8765
spring.codec.max-in-memory-size=10MB

# Application Name
spring.application.name=api-gateway

# Gateway Discovery Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Default Filters
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST
spring.cloud.gateway.default-filters[1]=JwtAuth

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# --- ROUTES ---

# 0: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 1: Course-Lesson Service
spring.cloud.gateway.routes[1].id=course-lesson-service
spring.cloud.gateway.routes[1].uri=lb://COURSE-LESSON-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses, /api/courses/**, /api/lessons, /api/lessons/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# 2: Enrollment Service
spring.cloud.gateway.routes[2].id=enrollment-service
spring.cloud.gateway.routes[2].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/enrollments, /api/enrollments/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# 3: Assessment Service
spring.cloud.gateway.routes[3].id=assessment-service
spring.cloud.gateway.routes[3].uri=lb://ASSESSMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/quizzes, /api/quizzes/**, /api/attempts, /api/attempts/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# 4: Payment Service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments, /api/payments/**, /api/subscriptions, /api/subscriptions/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# 5: Progress Service
spring.cloud.gateway.routes[5].id=progress-service
spring.cloud.gateway.routes[5].uri=lb://PROGRESS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/progress, /api/progress/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# 6: Certificate Service
spring.cloud.gateway.routes[6].id=certificate-service
spring.cloud.gateway.routes[6].uri=http://localhost:8090
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/certificates, /api/certificates/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

# 7: Discussion-Notification Service
spring.cloud.gateway.routes[7].id=discussion-notification-service
spring.cloud.gateway.routes[7].uri=lb://DISCUSSION-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/threads, /api/threads/**, /api/replies, /api/replies/**, /api/notifications, /api/notifications/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1

# --- SWAGGER ROUTES ---

# 8: Auth Swagger
spring.cloud.gateway.routes[8].id=auth-swagger
spring.cloud.gateway.routes[8].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/swagger/auth/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/swagger/auth/(?<remaining>.*), /${remaining}

# 9: Course Swagger
spring.cloud.gateway.routes[9].id=course-swagger
spring.cloud.gateway.routes[9].uri=lb://COURSE-LESSON-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/swagger/course/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/swagger/course/(?<remaining>.*), /${remaining}

# 10: Enrollment Swagger
spring.cloud.gateway.routes[10].id=enrollment-swagger
spring.cloud.gateway.routes[10].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/swagger/enrollment/**
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/swagger/enrollment/(?<remaining>.*), /${remaining}

# 11: Assessment Swagger
spring.cloud.gateway.routes[11].id=assessment-swagger
spring.cloud.gateway.routes[11].uri=lb://ASSESSMENT-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/swagger/assessment/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/swagger/assessment/(?<remaining>.*), /${remaining}

# 12: Payment Swagger
spring.cloud.gateway.routes[12].id=payment-swagger
spring.cloud.gateway.routes[12].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/swagger/payment/**
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/swagger/payment/(?<remaining>.*), /${remaining}

# 13: Progress Swagger
spring.cloud.gateway.routes[13].id=progress-swagger
spring.cloud.gateway.routes[13].uri=lb://PROGRESS-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/swagger/progress/**
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/swagger/progress/(?<remaining>.*), /${remaining}

# 14: DiscNotif Swagger
spring.cloud.gateway.routes[14].id=discnotif-swagger
spring.cloud.gateway.routes[14].uri=lb://DISCUSSION-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/swagger/discnotif/**
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/swagger/discnotif/(?<remaining>.*), /${remaining}

# 15: AI Service
spring.cloud.gateway.routes[15].id=ai-service
spring.cloud.gateway.routes[15].uri=lb://AI-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.routes[15].filters[0]=StripPrefix=1

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://admin:edulearn123@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
